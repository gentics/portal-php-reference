services:
  db:
    image: mariadb:10.7
    restart: "no"
    command: mariadbd --innodb-flush-method=fsync --sql-mode=""
    volumes:
      - ./.docker/db/dumps:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_ROOT_PASSWORD: ""
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3

  mesh:
    image: docker.gentics.com/gentics/mesh-mariadb:3.2.15
    restart: "no"
    volumes:
      - mesh-uploads:/uploads
      - mesh-keystore:/keystore
      - ./.docker/mesh/driver/mariadb-java-client-3.5.9.jar:/mesh/database/mariadb-java-client-3.5.9.jar
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    ports:
      - '8100:8080'
      - '5005:5005'
    environment:
      MESH_ELASTICSEARCH_URL: "null"
      MESH_ELASTICSEARCH_START_EMBEDDED: "false"
      MESH_UPDATECHECK: "false"
      MESH_INITIAL_ADMIN_PASSWORD: "admin"
      MESH_INITIAL_ADMIN_PASSWORD_FORCE_RESET: "false"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      MESH_JDBC_DATABASE_NAME: "mesh"
      MESH_JDBC_CONNECTION_USERNAME: "root"
      MESH_JDBC_CONNECTION_PASSWORD: ""
      MESH_DATABASE_ADDRESS: "db:3306"
      MESH_JDBC_CONNECTION_URL_EXTRA_PARAMS: ""

    depends_on:
      db:
        condition: service_healthy
  
  cms:
    image: docker.gentics.com/gentics/cms-oss:hotfix-6.4.x
    restart: "no"
    ports:
      - '8080:8080'
    volumes:
      - cms-data:/cms/data
      - ./cms/conf/extraconfig:/cms/conf/extraconfig
      - ./cms/packages:/cms/packages
      - ./cms/content-packages:/cms/content-packages
      
    environment:
      NODE_USER_PASSWORD: node
      NODE_DB_USER: root
      NODE_DB_PASSWORD: ""
      NODE_DB_HOST: db
      NODE_DB_NAME: node_utf8
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g"
      CONF_FILES: /cms/conf/extraconfig

      # Default Mesh connection
      CR_URL_EXAMPLE: "mesh:8080/example"
      CR_USERNAME_EXAMPLE: "admin"
      CR_PASSWORD_EXAMPLE: "admin"
    depends_on:
      db:
        condition: service_healthy
      mesh:
        condition: service_started

  portal:
    image: gentics-portal-php
    build:
      dockerfile: ./portal-files/Dockerfile
      context: .
      secrets:
        - repo-user
        - repo-pass
    ports:
      - 8000:8080
    ulimits:
      nproc: 65535
      nofile:
        soft: 100000
        hard: 200000
    environment:
      XDEBUG_ENABLED: "false"

    depends_on:
      mesh:
        condition: service_healthy

volumes:
  db-data:
    driver: local
  cms-data:
    driver: local
  mesh-uploads:
    driver: local
  mesh-keystore:
    driver: local

secrets:
  repo-user:
    file: .docker/secrets/repo-user
  repo-pass:
    file: .docker/secrets/repo-pass
